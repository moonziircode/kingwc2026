<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Hub - King Gambler WC 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <nav class="top-nav">
        <div class="nav-brand">KING GAMBLER</div>
        <div class="nav-user">
            <span id="player-nickname">Player</span>
            <button id="btn-logout" class="btn-text">Exit</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <!-- LEFT COLUMN: LEADERBOARD -->
        <aside class="sidebar-left">
            <div class="sidebar-header">
                <h2>Leaderboard</h2>
            </div>
            <div class="sidebar-content" id="tab-leaderboard">
                <div class="table-responsive">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Player</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Leaderboard injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </aside>

        <!-- CENTER COLUMN: MATCHES -->
        <section class="main-content">
            <header class="dashboard-header">
                <h1 id="league-name-display">My League</h1>
                
                <div id="host-mode-container" class="hidden">
                    <label class="switch-label">
                        <input type="checkbox" id="host-mode-toggle">
                        Host Mode
                    </label>
                </div>
            </header>
            
            <div class="filter-controls">
                <div class="phase-scroller">
                    <label for="round-filter">Phase:</label>
                    <select id="round-filter" class="form-select">
                        <option value="all">Semua Pertandingan</option>
                    </select>
                </div>
                <button id="btn-sync-scores" class="btn secondary shiny-btn">
                    🔄 Sync Skor
                </button>
            </div>
            
            <div class="predictions-grid" id="matches-container">
                <!-- Matches will be injected here by JS -->
            </div>
            
            <button class="btn primary w-full mt-4 shiny-btn" id="btn-save-predictions">Save Predictions</button>
        </section>

        <!-- RIGHT COLUMN: CHAT -->
        <aside class="sidebar-right">
            <div class="sidebar-header">
                <h2>League Chat</h2>
            </div>
            <div class="sidebar-content" id="tab-chat">
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages-container">
                        <!-- Chat messages injected by JS -->
                    </div>
                    <form id="chat-form" class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Ketik pesan..." required autocomplete="off">
                        <button type="submit" class="btn primary shiny-btn">Kirim</button>
                    </form>
                </div>
            </div>
        </aside>
    </main>

    <script src="matches.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
